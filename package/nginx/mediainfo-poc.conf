location = /mediainfo-poc/runtime {
    include fastcgi_params;
    fastcgi_param SCRIPT_NAME /mediainfo-poc/runtime;
    fastcgi_param HTTP_COOKIE $http_cookie;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param SERVER_ADDR $server_addr;
    fastcgi_param HTTP_X_DSM_SERVER_ADDR $server_addr;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_pass unix:/var/packages/mediainfo-poc/var/runtime.sock;
}
